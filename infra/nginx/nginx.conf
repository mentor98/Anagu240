# Anagu Land Administration Framework — NGINX reverse proxy
# Routes:
#   /api/   → NestJS backend (port 3001)
#   /mqtt   → EMQX WebSocket (port 8083)
#   /       → Next.js web app (port 3000)
#
# Client max body: 50 MB (for survey document uploads)
# Supports HTTP/1.1 upgrade for WebSocket connections (MQTT over WS)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # 50 MB — required for survey plan / land document uploads
    client_max_body_size 50m;

    # ── Upstream servers ───────────────────────────────────────────────────
    upstream backend {
        server backend:3001;
    }

    upstream web {
        server web:3000;
    }

    upstream mqtt_ws {
        server mqtt:8083;
    }

    # ── HTTP server (port 80) ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── /api/ → NestJS backend ─────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;
        }

        # ── /mqtt → EMQX WebSocket (MQTT over WS) ─────────────────────────
        location /mqtt {
            proxy_pass         http://mqtt_ws;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_read_timeout  3600s;  # hold WebSocket connections open
            proxy_send_timeout  3600s;
        }

        # ── / → Next.js web app ────────────────────────────────────────────
        location / {
            proxy_pass         http://web;
            proxy_http_version 1.1;

            # Next.js hot-reload (dev) and streaming SSR require upgrade
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
        }
    }

    # ── HTTPS server (port 443) — self-signed cert for local dev ──────────
    # Generate a self-signed cert:
    #   mkdir -p infra/nginx/certs
    #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout infra/nginx/certs/anagu.key \
    #     -out infra/nginx/certs/anagu.crt \
    #     -subj "/C=NG/ST=Lagos/O=Anagu/CN=localhost"
    #
    # Then mount infra/nginx/certs:/etc/nginx/certs in docker-compose.
    # Uncomment the block below once the certs exist.

    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/anagu.crt;
    #     ssl_certificate_key /etc/nginx/certs/anagu.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     client_max_body_size 50m;
    #
    #     location /api/  { proxy_pass http://backend; ... }
    #     location /mqtt  { proxy_pass http://mqtt_ws; ... }
    #     location /      { proxy_pass http://web;     ... }
    # }
}
