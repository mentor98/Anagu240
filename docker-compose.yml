version: "3.9"

# ============================================================
# Anagu Land Administration Framework — Docker Compose
# All infrastructure services for local development.
# ============================================================

networks:
  anagu_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  besu_data:
  emqx_data:
  emqx_log:

services:

  # ── PostgreSQL 15 + PostGIS 3 ──────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: anagu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anagu
      POSTGRES_USER: anagu
      POSTGRES_PASSWORD: anagu_secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - anagu_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anagu -d anagu"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: anagu_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anagu_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-10T02-53-48Z
    container_name: anagu_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: anagu_minio
      MINIO_ROOT_PASSWORD: anagu_minio_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  →  http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - anagu_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── MinIO bucket initialiser (runs once then exits) ───────
  minio_init:
    image: minio/mc:latest
    container_name: anagu_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - anagu_net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 anagu_minio anagu_minio_secret;
        mc mb --ignore-existing local/land-documents;
        mc mb --ignore-existing local/survey-plans;
        mc policy set public local/land-documents;
        echo 'MinIO buckets ready.';
      "

  # ── EMQX MQTT Broker ──────────────────────────────────────
  mqtt:
    image: emqx/emqx:5.6.0
    container_name: anagu_mqtt
    restart: unless-stopped
    environment:
      EMQX_NAME: anagu
      EMQX_HOST: mqtt
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: anagu_mqtt_admin
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # MQTT over WebSocket
      - "8084:8084"    # MQTT over WSS
      - "8883:8883"    # MQTT over TLS
      - "18083:18083"  # EMQX dashboard  →  http://localhost:18083
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - anagu_net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Hyperledger Besu (QBFT, permissioned) ─────────────────
  besu:
    image: hyperledger/besu:24.3
    container_name: anagu_besu
    restart: unless-stopped
    volumes:
      - ./infra/besu:/config:ro
      - besu_data:/data
    command:
      - "--config-file=/config/config.toml"
      - "--genesis-file=/config/genesis.json"
      - "--data-path=/data"
      - "--rpc-http-enabled"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-http-cors-origins=*"
      - "--rpc-http-api=ETH,NET,QBFT,WEB3,DEBUG,ADMIN,MINER"
      - "--rpc-ws-enabled"
      - "--rpc-ws-host=0.0.0.0"
      - "--rpc-ws-port=8546"
      - "--host-allowlist=*"
      - "--min-gas-price=0"
      - "--miner-enabled"
      - "--miner-coinbase=0xFE3B557E8Fb62b89F4916B721be55cEb828dBd73"
      - "--logging=INFO"
    ports:
      - "8545:8545"   # JSON-RPC HTTP
      - "8546:8546"   # JSON-RPC WebSocket
      - "30303:30303" # P2P
    networks:
      - anagu_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' -H 'Content-Type: application/json' http://localhost:8545 | grep -q result"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
